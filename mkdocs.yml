#copyright: Copyright &copy; 2020-2025
dev_addr: 127.0.0.1:8001
docs_dir: docs/src
edit_uri: "blob/develop/docs/src/"
repo_url: https://github.com/saxix/django-adminactions
site_dir: ./~build/docs
site_name: django-adminactions
site_url: https://github.com/saxix/django-adminactions
strict: false
exclude_docs: |
    _docs/*
    _hooks/*
    _includes/*
    _scripts/*
    ~*

markdown_extensions:
    - admonition
    - attr_list
    - md_in_html
    - pymdownx.superfences
    -   pymdownx.emoji:
            emoji_index: !!python/name:material.extensions.emoji.twemoji
            emoji_generator: !!python/name:material.extensions.emoji.to_svg
theme:
    name: "material"
    highlightjs: true
    hljs_languages:
        - yaml
        - django
    palette:
        -   scheme: default
            toggle:
                icon: material/brightness-7
                name: Switch to dark mode
                accent: indigo

        -   scheme: slate
            toggle:
                icon: material/brightness-4
                name: Switch to light mode
    features:
        #    - content.action.edit
        - content.code.annotate
        - content.code.copy
        - content.tooltips
        - header.autohidex
        - navigation.indexes
        - navigation.instant
        - navigation.instant.prefetch
        - navigation.instant.progress
validation:
    links:
        absolute_links: relative_to_docs

plugins:
    - awesome-pages
    - autorefs
    - include-markdown
    - macros
    - glightbox
    -   ezlinks:
            wikilinks: true
    -   mkdocstrings:
            default_handler: python
            handlers:
                python:
                    inventories:
                        - https://installer.readthedocs.io/en/stable/objects.inv
                        - https://django.readthedocs.org/en/5.1.x/objects.inv
                        - https://docs.python.org/3.13/objects.inv
    - search

watch:
    - src/
hooks:
    - docs/_hooks/hooks.py
    - docs/_hooks/sax.py
    - docs/_hooks/shortcodes.py

extra:
    interwiki:
        github: https://github.com/saxix/django-adminactions/issues/
        stackoverflow: stackoverflow.com/questions/
        google: https://www.google.com/search?q=
    app: django-adminactions
