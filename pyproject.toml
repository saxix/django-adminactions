[build-system]
build-backend = "hatchling.build"
requires = [
  "hatch-vcs>=0.4",
  "hatchling>=1.25",
]

[project]
name = "django-adminactions"
description = "Collections of useful actions to use with django.contrib.admin.ModelAdmin"
readme = "README.md"
license.file = "LICENSE"
maintainers = [
  { name = "Stefano Apostolico", email = "s.apostolico@gmail.com" },
]
authors = [
  { name = "sax", email = "s.apostolico@gmail.com" },
]
requires-python = ">=3.9"
classifiers = [
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 3.2",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.1",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

dynamic = [
  "version",
]
dependencies = [
  "pytz",
  "xlrd>=0.9.2",
  "xlwt",
]
optional-dependencies.dev = [
]
urls.Downloads = "https://github.com/saxix/django-adminactions"
urls.Homepage = "https://github.com/saxix/django-adminactions"

[dependency-groups]
dev = [
  "celery",
  "check-manifest",
  "covdefaults>=2.3",
  "django-admin-extra-urls",
  "django-dynamic-fixture",
  "django-environ",
  "django-webtest",
  "mock",
  "modernize",
  "mypy",
  "pillow",
  "psycopg2",
  "pytest",
  "pytest-cache",
  "pytest-cov",
  "pytest-django",
  "pytest-echo",
  "readme>=0.7.1",
  "redis>=5.2.1",
  "ruff>=0.9.4",
  "selenium>=2.42",
  "setuptools>=15",
  "tox>=4.2",
]

[tool.hatch]
build.hooks.vcs.version-file = "src/adminactions/version.py"
version.source = "vcs"

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
  "docs",
  "manage.py",
  "tests",
]
format.preview = true
format.docstring-code-line-length = 100
format.docstring-code-format = true
lint.select = [
  "ALL",
]
lint.ignore = [
  #  "A",
  #  "ANN",
  "ANN401",
  "ARG",
  "B",
  "BLE",
  "C",
  "COM",
  "CPY",
  "D",
  "DOC",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "F",
  "FBT",
  "FURB",
  "N",
  "PERF",
  "PGH",
  "PLC",
  "PLR",
  "PLW",
  "RET",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "TRY",
  "UP",
]
lint.per-file-ignores."docs/conf.py" = [
  "A001",   #
  "D100",   #
  "ERA001", #
  "INP001", #
]
lint.per-file-ignores."tests/**/*.py" = [
  "D",       # don"t care about documentation in tests
  "FBT",     # don"t care about booleans as positional arguments in tests
  "INP001",  # no implicit namespace
  "PLR2004", # Magic value used in comparison, consider replacing with a constant variable
  "PT",
  "S101",    # asserts allowed in tests...
  "S603",    # `subprocess` call: check for execution of untrusted input
]
lint.isort = { known-first-party = [ "pytest_echo" ] }

lint.preview = true

[tool.pyproject-fmt]
max_supported_python = "3.13"

[tool.pytest.ini_options]
django_find_project = false
norecursedirs = [ "demo", ".tox" ]
addopts = "--doctest-modules --echo-attr=django.conf.settings.DATABASES.default.ENGINE --tb=short --reuse-db --capture=no --doctest-glob=adminactions/*.py"
python_files = "tests/test_*.py tests/**/test_*.py src/*.py"
markers = [
  "functional: mark a test as functional",
  "selenium: selenium test",
  "skip: skip test",
]
testpaths = [
  "src",
  "tests",
]

[tool.coverage]
run.source = [
  "adminactions",
]
run.dynamic_context = "test_function"
run.branch = true
run.parallel = true
run.omit = [
  "**/create_extra_permissions.py",
]
run.plugins = [
  "covdefaults",
]
report.fail_under = 80
report.show_missing = true
report.exclude_lines = [
  "pragma: no cover",
]
html.show_contexts = true
html.skip_covered = false
paths.source = [
  "src",
  ".tox*/*/lib/python*/site-packages",
  ".tox*/pypy*/site-packages",
  ".tox*\\*\\Lib\\site-packages",
  "*/src",
  "*\\src",
]

[tool.uv]
package = true
