[project]
name = "django-adminactions"
version = "2.3.0"
description = "Collections of useful actions to use with django.contrib.admin.ModelAdmin"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "sax", email = "s.apostolico@gmail.com" },
]
requires-python = ">=3.11.0"
classifiers = [
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 3.2",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.0",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

dependencies = [
  "pytz",
  "xlrd>=0.9.2",
  "xlwt",
]
optional-dependencies.dev = [
]
urls.Downloads = "https://github.com/saxix/django-adminactions"
urls.Homepage = "https://github.com/saxix/django-adminactions"

[dependency-groups]
dev = [
  "black>=25.1",
  "celery>=5.4",
  "check-manifest>=0.50",
  "django-admin-extra-urls>=4.1.1",
  "django-dynamic-fixture>=4.0.1",
  "django-environ>=0.12",
  "django-webtest>1.9.6",
  "mock>=1.0.1",
  "modernize>=0.8",
  "mypy>=1.15",
  "pillow>=11.1",
  "psycopg2>=2.9.10",
  "pytest>=8.3.4",
  "pytest-cache>=1",
  "pytest-cov>=6",
  "pytest-django>=4.9",
  "pytest-echo>=1.8.1",
  "readme>=0.7.1",
  "redis>=5.2.1",
  "ruff>=0.9.4",
  "selenium>=2.42",
  "setuptools>=15",
  "tox>=4.2",
]

[tool.ruff]
target-version = "py311"
line-length = 120
format.preview = true
format.docstring-code-line-length = 100
format.docstring-code-format = true
lint.select = [
  "ALL",
]
lint.ignore = [
  #  "A",
  #  "ANN",
  "ANN401",
  "ARG",
  "B",
  "BLE",
  "C",
  "COM",
  "CPY",
  "D",
  "DOC",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "F",
  "FBT",
  "FURB",
  "N",
  "PERF",
  "PGH",
  "PLC",
  "PLR",
  "PLW",
  "RET",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "TRY",
  "UP",

]
lint.per-file-ignores."docs/conf.py" = [
  "A001",   #
  "D100",   #
  "ERA001", #
  "INP001", #
]
lint.per-file-ignores."tests/**/*.py" = [
  "D",       # don"t care about documentation in tests
  "FBT",     # don"t care about booleans as positional arguments in tests
  "INP001",  # no implicit namespace
  "PLR2004", # Magic value used in comparison, consider replacing with a constant variable
  "S101",    # asserts allowed in tests...
  "S603",    # `subprocess` call: check for execution of untrusted input
]
lint.isort = { known-first-party = [ "pytest_echo" ] }

lint.preview = true

[tool.pyproject-fmt]
max_supported_python = "3.13"

[tool.pytest.ini_options]
django_find_project = false
norecursedirs = [ "demo", ".tox" ]
addopts = "--doctest-modules --tb=short --reuse-db --cov=adminactions --cov-report=html --cov-config=tests/.coveragerc --capture=no --doctest-glob=adminactions/*.py"
echo-version = [ "django" ]

python_files = "tests/test_*.py tests/**/test_*.py"
markers = [
  "functional: mark a test as functional",
  "selenium: selenium test",
  "skip: skip test",
]

[tool.uv]
package = true
